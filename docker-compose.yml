# Rayavriti NetMonitor — Docker Compose
#
# Usage:
#   1. Copy .env.example to .env and configure required values
#   2. docker compose up -d
#   3. Open http://localhost:3000
#
# This default config uses a standard bridge network so it runs on
# Linux, macOS, and Windows. Services reach each other by name
# (redis, timescaledb, netmonitor) and ports are published to the host.
#
# NOTE: Host networking (network_mode: host) is Linux-only and is what
# enables packet capture / direct LAN device monitoring. To enable those
# features on Linux, run with the optional override:
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: rayavriti-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - appnet

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: rayavriti-timescaledb
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-netmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netmonitor} -d ${POSTGRES_DB:-netmonitor}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - appnet

  netmonitor:
    build:
      context: .
      target: production
    container_name: rayavriti-netmonitor
    # Bridge networking: services communicate by name. Ports are published
    # to the host so the web UI is reachable at http://localhost:3000.
    # (Linux-only host networking / packet capture is in docker-compose.linux.yml)
    ports:
      - "3000:3000"
      - "2055:2055/udp"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-netmonitor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@timescaledb:5432/${POSTGRES_DB:-netmonitor}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    cap_add:
      - NET_RAW              # Required for packet capture (libpcap/cap)
      - NET_ADMIN            # Required for interface access
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/data/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - appnet

  simulator:
    build:
      context: .
      target: development
    container_name: rayavriti-netmonitor-simulator
    profiles:
      - simulator
    env_file: .env
    environment:
      SIMULATOR_API_URL: http://netmonitor:3000
      SIMULATOR_WRITE_MODE: api
    command: >
      sh -c "until wget -qO- http://netmonitor:3000/health >/dev/null 2>&1;
      do sleep 2; done;
      npm run simulate -- --duration=${SIMULATOR_DURATION:-600}
      --speed=${SIMULATOR_SPEED:-1}
      --scenario=${SIMULATOR_SCENARIO:-mixed}"
    depends_on:
      - netmonitor
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
