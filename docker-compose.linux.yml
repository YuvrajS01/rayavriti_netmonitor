# Linux-only override — enables host networking for packet capture
# and direct LAN device monitoring (ping, SNMP, port scans, NetFlow).
#
# Host networking is NOT supported on Windows or macOS. Use this only on Linux:
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d
#
# With host networking, services run in the host's network namespace, so
# localhost resolves to the host where Redis/Postgres ports are published.

services:
  netmonitor:
    network_mode: host
    # Host networking publishes ports directly; remove the bridge mappings.
    ports: !reset []
    networks: !reset []
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-netmonitor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@localhost:5433/${POSTGRES_DB:-netmonitor}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@localhost:6379/0

  simulator:
    network_mode: host
    networks: !reset []
    environment:
      SIMULATOR_API_URL: http://localhost:3000
